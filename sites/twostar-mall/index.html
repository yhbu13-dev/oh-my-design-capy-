<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>투스타몰</title>
  <meta name="description" content="음료·커피·시럽 박스 도매 투스타몰. 오전 9시까지 결제하면 당일 출발합니다.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='70 130 590 545'><polygon fill='%233398c9' points='188,213 388,213 388,410'/><polygon fill='%23afdfed' points='427,135 568,272 427,410'/><polygon fill='%237ec9e0' points='652,245 652,440 453,440'/><polygon fill='%2355bde5' points='217,297 357,435 76,435'/><polygon fill='%2355bde5' points='155,473 355,473 155,668'/></svg>">
  <link rel="preload" href="assets/fonts/Roboto.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="util">
    <div class="util__in">
      <p class="util__ship"><span data-shipday>오늘출발</span> 마감까지 <b id="cutoff" class="num">--:--:--</b> · <span class="util__rule" data-shiprule></span></p>
      <nav class="util__links" aria-label="고객 메뉴">
        <button type="button" id="utilOrder">주문하기</button>
        <button type="button" data-scroll="biz">대량구매 문의</button>
        <span>고객센터 <b class="num">031-591-3447</b></span>
      </nav>
    </div>
  </div>

  <header class="nav">
    <div class="nav__in">
      <a class="wordmark" href="./" aria-label="투스타몰 홈">
        <svg class="mark" viewBox="70 130 590 545" aria-hidden="true"><polygon class="m1" points="188,213 388,213 388,410"/><polygon class="m2" points="427,135 568,272 427,410"/><polygon class="m3" points="652,245 652,440 453,440"/><polygon class="m4" points="217,297 357,435 76,435"/><polygon class="m5" points="155,473 355,473 155,668"/></svg>
        <span class="wordmark__t">투스타몰</span>
      </a>
      <label class="search">
        <span class="sr-only">상품 검색</span>
        <input id="q" type="search" placeholder="찾으시는 음료를 검색해 보세요" autocomplete="off" enterkeyhint="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
      </label>
      <div class="nav__cta">
        <button class="navicon cart-link" id="openCart" type="button" aria-label="장바구니">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l1.6 9.2a1.6 1.6 0 0 0 1.6 1.3h7.9a1.6 1.6 0 0 0 1.6-1.2L20 8.5H7"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
          <span class="nav__label">장바구니</span>
          <span class="cart-link__n" id="cartCount" hidden>0</span>
        </button>
      </div>
    </div>
  </header>

  <div class="tabs-wrap">
    <div class="tabs-row">
      <nav class="tabs" id="cats" aria-label="카테고리"></nav>
      <nav class="gnb" aria-label="바로가기">
        <button type="button" data-scroll="planner">탕비실 계산기</button>
        <button type="button" data-scroll="compare">100ml당 가격</button>
        <button type="button" data-goto-coll="deal">특가</button>
      </nav>
    </div>
  </div>

  <div class="notice" id="sampleNotice" hidden>
    <b>[샘플]</b> 상품이 표시되고 있습니다. <code>scripts/</code>의 가져오기 스크립트로 실제 상품을 불러오세요.
  </div>

  <main class="shelf">
    <div id="home">
      <section class="main" aria-label="오늘의 상품">
        <div class="bento" id="bento"></div>
      </section>

      <section class="sec cats-sec" aria-label="카테고리 바로가기">
        <nav class="caticons" id="catIcons"></nav>
      </section>

      <section class="sec" aria-labelledby="dealTitle">
        <header class="sec__head"><h2 id="dealTitle">지금 할인 중인 상품</h2><button class="sec__more" type="button" data-goto-coll="deal">더보기</button></header>
        <ul class="rail" id="deals"></ul>
      </section>

      <section class="sec platform" aria-labelledby="rankTitle">
        <header class="sec__head"><h2 id="rankTitle">많이 찾는 상품 <span class="sec__sub">카테고리별 TOP 10</span></h2></header>
        <div class="dash" id="dash"></div>
      </section>

      <section class="sec planner" id="planner" aria-labelledby="plannerTitle"></section>

      <section class="sec compare" id="compare" aria-labelledby="compareTitle"></section>

      <section class="sec" aria-labelledby="promoTitle">
        <header class="sec__head"><h2 id="promoTitle">기획전</h2></header>
        <div class="promos" id="promos"></div>
      </section>

      <section class="band" id="biz" aria-labelledby="bizTitle"></section>
    </div>

    <div class="shelf__bar" id="listTop">
      <p class="shelf__count" id="resultCount"></p>
      <div class="shelf__tools">
        <button class="toggle" id="freeOnly" type="button" aria-pressed="false">무료배송만</button>
        <label class="sort">
          <span class="sr-only">정렬</span>
          <select id="sort">
            <option value="popular">추천순</option>
            <option value="unit">개당 가격 낮은순</option>
            <option value="low">낮은 가격순</option>
            <option value="high">높은 가격순</option>
            <option value="review">리뷰 많은순</option>
            <option value="new">최신순</option>
          </select>
        </label>
      </div>
    </div>

    <ul class="grid" id="grid" aria-live="polite"></ul>
    <button class="more" id="more" type="button" hidden>상품 더 보기</button>
    <p class="empty" id="empty" hidden>검색 결과가 없습니다. 다른 이름으로 찾아보세요.</p>
  </main>

  <footer class="foot" id="foot"></footer>

  <div class="bar" id="bar" hidden>
    <div class="bar__in">
      <div class="bar__sum">
        <span id="barItems"></span>
        <strong id="barTotal"></strong>
        <small id="barShip"></small>
      </div>
      <button class="cta" id="barCheckout" type="button">주문하기</button>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <header class="sheet__head">
      <h2 id="sheetTitle"></h2>
      <button class="x" id="sheetClose" type="button" aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="sheet__body" id="sheetBody"></div>
    <footer class="sheet__foot" id="sheetFoot"></footer>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
