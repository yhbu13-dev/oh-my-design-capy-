<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>투스타몰</title>
  <meta name="description" content="카페, 사무실, 가정 어디든 — 음료 고민은 투스타몰에서 해결하세요.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="strip">
    <div class="strip__in">
      <p class="strip__ship"><span class="strip__dot" aria-hidden="true"></span>오늘 출발 <b id="cutoff" class="num">--:--:--</b> 안에 결제하면 오늘 발송</p>
      <p class="strip__cs">고객센터 <span class="num">031-591-3447</span></p>
    </div>
  </div>
  <header class="masthead">
    <div class="masthead__row">
      <a class="wordmark" href="./" aria-label="투스타몰 홈">
        <svg class="mark" viewBox="0 0 40 24" aria-hidden="true"><path class="mark__a" d="M11 1.5l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L11 16.7l-6.1 3.4 1.4-6.8L1.2 8.6l6.9-.8z"/><path class="mark__b" d="M27 3.5l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L27 18.7l-6.1 3.4 1.4-6.8-5.1-4.7 6.9-.8z"/></svg>
        <span>투스타몰</span>
      </a>
      <p class="masthead__tag">카페 · 사무실 · 가정용 음료 대용량</p>
      <button class="cart-link" id="openCart" type="button" aria-label="장바구니">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l1.6 9.2a1.6 1.6 0 0 0 1.6 1.3h7.9a1.6 1.6 0 0 0 1.6-1.2L20 8.5H7"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg>
        <span class="cart-link__n" id="cartCount" hidden>0</span>
      </button>
    </div>
    <label class="search">
      <span class="sr-only">상품 검색</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="찾는 음료가 있나요? 예) 제로콜라, 시럽" autocomplete="off" enterkeyhint="search">
    </label>
  </header>

  <nav class="tabs" id="cats" aria-label="카테고리"></nav>

  <div class="notice" id="sampleNotice" hidden>
    <b>[샘플]</b> 상품이 표시되고 있습니다. <code>scripts/</code>의 가져오기 스크립트로 실제 상품을 불러오세요.
  </div>

  <main class="shelf">
    <section class="promos" id="promos" aria-label="기획전"></section>
    <div class="shelf__bar">
      <p class="shelf__count" id="resultCount"></p>
      <div class="shelf__tools">
        <button class="toggle" id="freeOnly" type="button" aria-pressed="false">무료배송만</button>
        <label class="sort">
          <span class="sr-only">정렬</span>
          <select id="sort">
            <option value="popular">추천순</option>
            <option value="unit">개당 가격 낮은순</option>
            <option value="low">낮은 가격순</option>
            <option value="high">높은 가격순</option>
            <option value="review">리뷰 많은순</option>
            <option value="new">최신순</option>
          </select>
        </label>
      </div>
    </div>

    <ul class="grid" id="grid" aria-live="polite"></ul>
    <button class="more" id="more" type="button" hidden>상품 더 보기</button>
    <p class="empty" id="empty" hidden>검색 결과가 없습니다. 다른 이름으로 찾아보세요.</p>
  </main>

  <footer class="foot" id="foot"></footer>

  <div class="bar" id="bar" hidden>
    <div class="bar__in">
      <div class="bar__sum">
        <span id="barItems"></span>
        <strong id="barTotal"></strong>
        <small id="barShip"></small>
      </div>
      <button class="cta" id="barCheckout" type="button">주문하기</button>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <header class="sheet__head">
      <h2 id="sheetTitle"></h2>
      <button class="x" id="sheetClose" type="button" aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="sheet__body" id="sheetBody"></div>
    <footer class="sheet__foot" id="sheetFoot"></footer>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
