<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>투스타몰</title>
  <meta name="description" content="투스타몰 — 고르고, 담고, 한 화면에서 결제까지.">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top__inner">
      <a class="logo" href="./" aria-label="투스타몰 홈">
        <span class="logo__mark" aria-hidden="true">★★</span>
        <span class="logo__text">투스타몰</span>
      </a>
      <label class="search">
        <span class="sr-only">상품 검색</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="상품명으로 찾기" autocomplete="off">
      </label>
      <button class="cart-btn" id="openCart" type="button" aria-label="장바구니">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1.2"/><circle cx="17" cy="20.5" r="1.2"/></svg>
        <span class="cart-btn__count" id="cartCount" hidden>0</span>
      </button>
    </div>
    <nav class="cats" id="cats" aria-label="카테고리"></nav>
  </header>

  <div class="notice" id="sampleNotice" hidden>
    지금 보이는 상품은 <b>[샘플]</b>입니다. <code>node scripts/import-smartstore.mjs</code> 또는 엑셀 가져오기로 실제 전 상품을 불러오세요.
  </div>

  <main class="wrap">
    <section class="promise" aria-label="구매 안내">
      <div><b>로그인 없이</b> 주문</div>
      <div><b>한 화면</b> 결제</div>
      <div id="freeShipCopy"><b>무료배송</b></div>
    </section>

    <div class="toolbar">
      <p class="toolbar__count" id="resultCount"></p>
      <label class="sort">
        <span class="sr-only">정렬</span>
        <select id="sort">
          <option value="popular">인기순</option>
          <option value="new">최신순</option>
          <option value="low">낮은 가격순</option>
          <option value="high">높은 가격순</option>
          <option value="review">리뷰 많은순</option>
        </select>
      </label>
    </div>

    <ul class="grid" id="grid" aria-live="polite"></ul>
    <p class="empty" id="empty" hidden>찾는 상품이 없어요. 검색어를 바꿔보세요.</p>
  </main>

  <footer class="foot" id="foot"></footer>

  <!-- 하단 고정 주문 바: 어디서든 한 번에 결제로 -->
  <div class="bar" id="bar" hidden>
    <div class="bar__ship" id="barShip"></div>
    <div class="bar__row">
      <div class="bar__sum">
        <span id="barItems">0개</span>
        <strong id="barTotal">0원</strong>
      </div>
      <button class="btn btn--primary btn--lg" id="barCheckout" type="button">바로 주문하기</button>
    </div>
  </div>

  <!-- 바텀시트 (옵션 선택 / 상품 상세 / 결제) -->
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet__grip" aria-hidden="true"></div>
    <header class="sheet__head">
      <h2 id="sheetTitle"></h2>
      <button class="icon-btn" id="sheetClose" type="button" aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="sheet__body" id="sheetBody"></div>
    <footer class="sheet__foot" id="sheetFoot"></footer>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
